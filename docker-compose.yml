services:
  db:
    image: postgres:15-alpine
    container_name: guardian-postgres
    restart: always
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardian-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://guardian:guardian@db:5432/guardian
      JWT_SECRET_KEY: dev-secret-key-change-in-production-123456789
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
