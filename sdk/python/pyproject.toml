[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardian-sdk"
version = "0.1.0"
description = "Python SDK for Guardian - Action review and policy enforcement for automated systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Guardian Team" }
]
keywords = ["security", "ai-agents", "policy-enforcement", "action-review"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/iokuru/guardian"
Repository = "https://github.com/iokuru/guardian"
